---
# The SRC Nginx plugin >= 1.2.0 uses acme.sh and stores certificates in /etc/ssl/acme/<fqdn>/.
# Older versions used certbot, which stored them in /etc/letsencrypt/live/<fqdn>/.
- name: Check for acme.sh certificate (SRC Nginx plugin >= 1.2.0)
  ansible.builtin.stat:
    path: "{{ _galaxy_acme_cert_dir }}/fullchain.pem"
  register: _galaxy_acme_cert

- name: Set TLS certificate paths for the interactive tool proxy
  ansible.builtin.set_fact:
    _galaxy_tls_legacy_certbot: "{{ not _galaxy_acme_cert.stat.exists }}"
    _galaxy_tls_cert: >-
      {{ _galaxy_acme_cert.stat.exists | ternary(_galaxy_acme_cert_dir ~ '/fullchain.pem',
         '/etc/letsencrypt/live/' ~ _galaxy_server_fqdn ~ '/fullchain.pem') }}
    _galaxy_tls_key: >-
      {{ _galaxy_acme_cert.stat.exists | ternary(_galaxy_acme_cert_dir ~ '/key.pem',
         '/etc/letsencrypt/live/' ~ _galaxy_server_fqdn ~ '/privkey.pem') }}

- name: Add interactive tool proxy conf for nginx
  ansible.builtin.template:
    src: templates/nginx/galaxy-gie-proxy.j2
    dest: /etc/nginx/conf.d/gie-server.conf
    mode: "0640"
    owner: www-data
    group: www-data
  notify: restart nginx

- name: Remove comment to activate default interactive tools
  # match [\d\D\n] to match digits, non-digits, and newlines -- this is because .* does not match newlines in ansible.builtin.replace
  ansible.builtin.replace:
    path: "{{ galaxy_config_dir }}/tool_conf.xml"
    regexp: \s*<!--\s*\n.*(<section id="interactivetools" name="Interactive tools">[\d\D\n]*</section>)\n\s*-->
    replace: \n  \1

- name: Copy script to dynamically determine if a job should use Docker
  ansible.builtin.template:
    src: default_dispatch.py.j2
    dest: "{{ galaxy_server_dir }}/lib/galaxy/jobs/rules/{{ _galaxy_default_dispatcher }}.py"
    mode: "0755"
