---
# Variables derived from component parameters in ResearchCLoud

_galaxy_job_destinations: # valid job destinations
  - docker
  - singularity
  - local
_galaxy_bootstrap: "{{ _molecule_idempotence | ternary(false, src_galaxy_bootstrap | default(false, true) | bool) }}"
_galaxy_ibridges_enabled: "{{ src_ibridges | default(true, true) | bool }}"
_galaxy_default_tool_files:
  - path: tools/ibridges.yml
    enabled: "{{ _galaxy_ibridges_enabled }}"
_galaxy_default_tool_files_list: "{{ _galaxy_default_tool_files | selectattr('enabled') | map(attribute='path') | list }}"
_galaxy_admin_co_group: "{{ src_galaxy_co_admin_group | default('src_co_admin', true) }}"
_galaxy_custom_repo: "{{ src_galaxy_custom_repo | default('') }}"
_galaxy_custom_repo_branch: "{{ src_galaxy_custom_repo_branch | default('main', true) }}"
_galaxy_api_exposed: "{{ src_galaxy_api_exposed | default(true, true) }}"
_galaxy_use_interactive_tools: "{{ src_galaxy_interactive_tools | default(false, true) | bool }}"
_galaxy_server_fqdn: "{{ workspace_fqdn | default('localhost', true) }}"
_galaxy_jobs_fallback: singularity
_galaxy_jobs_default: >-
  {{ (src_galaxy_jobs_default is not defined or src_galaxy_jobs_default not in _galaxy_job_destinations) | ternary(_galaxy_jobs_fallback, src_galaxy_jobs_default) }}
_galaxy_enable_docker: "{{ _galaxy_use_interactive_tools or (_galaxy_jobs_default == 'docker') }}"
_galaxy_enable_tus: "{{ src_galaxy_enable_tus | default(true, true) | bool }}"
_galaxy_enable_cvmfs: "{{ _molecule_active | ternary(false, src_galaxy_cvmfs | default(true, true) | bool) }}"
_galaxy_brand: "{{ src_galaxy_brand | default('SURF ResearchCloud', true) }}"

# Build the final lists of tool and workflow installation files

_galaxy_tool_files: "{{ src_galaxy_tool_files | default('', true) | split(',') | select() + _galaxy_default_tool_files_list }}"
_galaxy_workflow_files: "{{ src_galaxy_workflow_files | default('') | split(',') | select() }}"

_galaxy_pulsar_configs_input: "{{ src_galaxy_pulsar_configs | default('', true) }}"
_galaxy_pulsar_tool_mappings_input: "{{ src_galaxy_pulsar_tool_mappings | default('', true) }}"
_galaxy_pulsar_relay_configs_input: "{{ src_galaxy_pulsar_relay_configs | default('', true) }}"

# Parse Pulsar configs
# The Pulsar config redirects users to copy and pass yml strings via the component vars. The config normalises the passed strings  
_galaxy_pulsar_configs_raw: >-
  {%- if _galaxy_pulsar_configs_input == '' or _galaxy_pulsar_configs_input == '[]' -%}
  []
  {%- else -%}
    {%- set step1 = _galaxy_pulsar_configs_input | regex_replace('([{,]\s*)(\w+):', '\\1"\\2":') -%}
    {%- set step2 = step1 | regex_replace(':\s*([^,\[\]{}"\'\s][^,\[\]{}]*?)(\s*[,}\]])', ': "\\1"\\2') -%}
    {%- set step3 = step2 | regex_replace(':\s*"(true|false)"', ': \\1') -%}
    {{ step3 | from_json }}
  {%- endif -%}

# Parse tool mappings
_galaxy_pulsar_tool_mappings: >-
  {%- if _galaxy_pulsar_tool_mappings_input == '' or _galaxy_pulsar_tool_mappings_input == '[]' -%}
  []
  {%- else -%}
    {%- set step1 = _galaxy_pulsar_tool_mappings_input | regex_replace('([{,]\s*)(\w+):', '\\1"\\2":') -%}
    {%- set step2 = step1 | regex_replace(':\s*([^,\[\]{}"\'\s][^,\[\]{}]*?)(\s*[,}\]])', ': "\\1"\\2') -%}
    {{ step2 | from_json }}
  {%- endif -%}

# Parse Pulsar relay (message queue) configs, same one-line list format as src_galaxy_pulsar_configs, e.g.
# [{name: srcrelay, relay_url: https://RELAY_HOST, relay_username: galaxy-pulsar, relay_password: SECRET, relay_topic_prefix: src, jobs_directory: /mnt/pulsar/files/staging}]
# Values may not contain , [ ] { } or double quotes, and are trimmed; the values true/false become booleans.
# step0 escapes backslashes so they survive the JSON conversion.
_galaxy_pulsar_relay_configs: >-
  {%- if _galaxy_pulsar_relay_configs_input == '' or _galaxy_pulsar_relay_configs_input == '[]' -%}
  []
  {%- else -%}
    {%- set step0 = _galaxy_pulsar_relay_configs_input | regex_replace('\\\\', '\\\\\\\\') -%}
    {%- set step1 = step0 | regex_replace('([{,]\s*)(\w+):', '\\1"\\2":') -%}
    {%- set step2 = step1 | regex_replace(':\s*([^,\[\]{}"\'\s][^,\[\]{}]*?)(\s*[,}\]])', ': "\\1"\\2') -%}
    {%- set step3 = step2 | regex_replace(':\s*"(true|false)"', ': \\1') -%}
    {{ step3 | from_json }}
  {%- endif -%}

# Relay config keys handled explicitly by job_conf.yml.j2. Any other key of a relay item is passed through
# unchanged to its environment (e.g. outputs_to_working_directory, tmp_dir). The MQ runner ignores the REST-only
# destination keys url and private_token, so they are dropped.
_galaxy_pulsar_relay_known_keys:
  - name
  - relay_url
  - relay_username
  - relay_password
  - relay_topic_prefix
  - galaxy_url
  - jobs_directory
  - manager
  - dependency_resolution
  - default_file_action
  - docker_enabled
  - docker_set_user
  - docker_memory
  - docker_sudo
  - singularity_enabled
  - container_resolvers
  - url
  - private_token
_galaxy_pulsar_relay_required_keys:
  - relay_url
  - relay_username
  - relay_password
  - jobs_directory

# Check if there are pulsar configs (REST and/or relay)
_galaxy_has_pulsar_rest: "{{ (_galaxy_pulsar_configs_raw | length > 0) | bool }}"
_galaxy_has_pulsar_relay: "{{ (_galaxy_pulsar_relay_configs | length > 0) | bool }}"
_galaxy_has_pulsar: "{{ (_galaxy_has_pulsar_rest or _galaxy_has_pulsar_relay) | bool }}"

# Relay mode needs exactly one process that runs job runners. Every Galaxy process
# with a relay runner long-polls the relay and receives every Pulsar status update,
# and Galaxy 26.0 finishes a job from any process that receives its update (with
# RabbitMQ each message reaches only one consumer). Without a dedicated handler,
# both Gunicorn workers are job handlers and finish each job twice. With relay
# configs, Gravity therefore runs one handler in the job-handlers pool and the job
# configuration sets an explicit assignment method, so web workers stop handling
# jobs. Do not raise processes above 1 while relay mode is used.
_galaxy_gravity_handlers: >-
  {{ {'handler': {'processes': 1, 'pools': ['job-handlers']}} if _galaxy_has_pulsar_relay | bool else {} }}
# Note that some component parameters are also used in galaxy_vars.yml:
# src_galaxy_storage_path
# src_galaxy_version
